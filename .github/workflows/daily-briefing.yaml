name: Daily Immigration Policy Briefing

on:
  schedule:
    # 수신자가 "아침 8~9시" 도착을 요구. 실측 지연 파이프라인:
    #   1) GitHub Actions cron 지연 ~60분 (이 리포 실 데이터: 07:00 KST 예약 → 07:55~08:15 KST 시작)
    #   2) 워크플로우 실행 ~5분
    #   3) 수신 측 메일 서버 SMTP 지연 ~3시간 (KAIST 조직 메일 스캐너/큐 추정)
    # 총 ~4시간 파이프라인 → 8~9 AM 도착 위해 cron 을 KST 05:00 으로 설정.
    #   KST 05:00 cron (UTC 20:00 전일) → 실제 실행 ~05:55 → 발송 ~06:00 → 도착 ~08:00~09:00 KST.
    # 윈도우: [어제 05:00 KST, 오늘 05:00 KST). 게시일 ≤ 당일 05:00 KST 필터.
    # 주의: WINDOW_END_HOUR/MINUTE 와 트리거 시각은 동기화 필요 — compute_window 가
    # `end > now` 일 때 윈도우를 하루 뒤로 미는 분기를 갖고 있어, 트리거가 윈도우 종료보다
    # 앞서 정시 발사되면 잘못된 날짜를 발송하게 됨.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송하지 않고 본문만 stdout 출력"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "각 사이트 HTML 구조 진단 (셀렉터 보정용, 본 작업은 실행 안 함)"
        type: boolean
        required: false
        default: false
      recipient_email:
        description: "샘플 발송용 1회성 수신자 (비우면 BRIEFING_RECIPIENT_EMAIL secret 사용)"
        type: string
        required: false
        default: ""

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore briefing state cache
        uses: actions/cache@v4
        with:
          path: data/state.sqlite3
          # Cache key bumps on every run; previous run's cache restored on miss.
          key: briefing-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            briefing-state-${{ runner.os }}-

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS || '24' }}
          WINDOW_END_HOUR_KST: ${{ vars.WINDOW_END_HOUR_KST || '5' }}
          WINDOW_END_MINUTE_KST: ${{ vars.WINDOW_END_MINUTE_KST || '0' }}
          ISSUE_KEEP_DAYS: ${{ vars.ISSUE_KEEP_DAYS || '30' }}
          # 이메일 채널: GitHub Issue 경유가 아닌 SMTP 로 직접 발송 → 수신자 입장에서 GitHub 흔적 0.
          # 레거시 운영과 동일한 secret 명 재사용 (EMAIL_SENDER/EMAIL_PASSWORD/EMAIL_RECEIVER).
          # workflow_dispatch 의 recipient_email 입력은 EMAIL_RECEIVER 를 덮어쓴다 (1회성 샘플 발송용).
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          BRIEFING_RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email != '' && github.event.inputs.recipient_email || secrets.EMAIL_RECEIVER }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || '0' }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || '이민·비자 정책 브리핑' }}
          # 이메일 활성화 시 Issue 는 기본 OFF. 둘 다 보내려면 BRIEFING_PUBLISH_ISSUE=1 (var)
          BRIEFING_PUBLISH_ISSUE: ${{ vars.BRIEFING_PUBLISH_ISSUE || '' }}
          # GITHUB_REPOSITORY is auto-set by the runner; GITHUB_TOKEN must be passed explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.diagnose }}" = "true" ]; then
            python -m briefing.diagnose
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m briefing.main --dry-run
          else
            python -m briefing.main
          fi

      - name: Upload state as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-state-${{ github.run_id }}
          path: |
            data/state.sqlite3
            data/diagnose/
          retention-days: 30
          if-no-files-found: ignore
