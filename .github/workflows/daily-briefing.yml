name: Daily Immigration Policy Briefing

on:
  schedule:
    # 한국시간 매일 09:30 = UTC 00:30
    # 윈도우: 어제 09:30 KST ~ 오늘 09:30 KST. 게시일 ≤ 당일 09:30 KST 필터 적용.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Issue를 생성하지 않고 본문만 출력"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "각 사이트 HTML 구조 진단 (셀렉터 보정용, 본 작업은 실행 안 함)"
        type: boolean
        required: false
        default: false
      recipient_email:
        description: "샘플 발송용 1회성 수신자 (비우면 BRIEFING_RECIPIENT_EMAIL secret 사용)"
        type: string
        required: false
        default: ""

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore briefing state cache
        uses: actions/cache@v4
        with:
          path: |
            data/state.sqlite3
            data/hikorea_files
          # Cache key bumps on every run; previous run's cache restored on miss.
          key: briefing-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            briefing-state-${{ runner.os }}-

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS || '24' }}
          WINDOW_END_HOUR_KST: ${{ vars.WINDOW_END_HOUR_KST || '9' }}
          WINDOW_END_MINUTE_KST: ${{ vars.WINDOW_END_MINUTE_KST || '30' }}
          ISSUE_KEEP_DAYS: ${{ vars.ISSUE_KEEP_DAYS || '30' }}
          # 이메일 채널: GitHub Issue 경유가 아닌 SMTP 로 직접 발송 → 수신자 입장에서 GitHub 흔적 0.
          # 레거시 운영과 동일한 secret 명 재사용 (EMAIL_SENDER/EMAIL_PASSWORD/EMAIL_RECEIVER).
          # workflow_dispatch 의 recipient_email 입력은 EMAIL_RECEIVER 를 덮어쓴다 (1회성 샘플 발송용).
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Resend HTTPS API (선택). 설정되면 SMTP 대신 자동 사용.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          BRIEFING_RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email != '' && github.event.inputs.recipient_email || secrets.EMAIL_RECEIVER }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || '0' }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || '이민·비자 정책 브리핑' }}
          # 이메일 활성화 시 Issue 는 기본 OFF. 둘 다 보내려면 BRIEFING_PUBLISH_ISSUE=1 (var)
          BRIEFING_PUBLISH_ISSUE: ${{ vars.BRIEFING_PUBLISH_ISSUE || '' }}
          # GITHUB_REPOSITORY is auto-set by the runner; GITHUB_TOKEN must be passed explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.diagnose }}" = "true" ]; then
            python -m briefing.diagnose
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m briefing.main --dry-run
          else
            python -m briefing.main
          fi

      - name: Upload state as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-state-${{ github.run_id }}
          path: |
            data/state.sqlite3
            data/hikorea_files/
            data/diagnose/
          retention-days: 30
          if-no-files-found: ignore
