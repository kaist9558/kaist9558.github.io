name: Daily Immigration Policy Briefing

on:
  schedule:
    # 윈도우 종료는 KST 07:00 — 발송 시각을 KST 10시 무렵에 맞추기 위한 트리거 앞당김.
    # GitHub Actions 무료 cron 은 평균 ~3시간 24분 지연되므로,
    # cron 트리거 KST 07:00 (UTC 22:00 전일) → 실제 실행 ~KST 10:24 → 발송 ~KST 10:30 ± 30분.
    # 윈도우: [어제 07:00 KST, 오늘 07:00 KST). 게시일 ≤ 당일 07:00 KST 필터.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송하지 않고 본문만 stdout 출력"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "각 사이트 HTML 구조 진단 (셀렉터 보정용, 본 작업은 실행 안 함)"
        type: boolean
        required: false
        default: false
      recipient_email:
        description: "샘플 발송용 1회성 수신자 (비우면 BRIEFING_RECIPIENT_EMAIL secret 사용)"
        type: string
        required: false
        default: ""

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore briefing state cache
        uses: actions/cache@v4
        with:
          path: data/state.sqlite3
          # Cache key bumps on every run; previous run's cache restored on miss.
          key: briefing-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            briefing-state-${{ runner.os }}-

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS || '24' }}
          WINDOW_END_HOUR_KST: ${{ vars.WINDOW_END_HOUR_KST || '7' }}
          WINDOW_END_MINUTE_KST: ${{ vars.WINDOW_END_MINUTE_KST || '0' }}
          ISSUE_KEEP_DAYS: ${{ vars.ISSUE_KEEP_DAYS || '30' }}
          # 이메일 채널: GitHub Issue 경유가 아닌 SMTP 로 직접 발송 → 수신자 입장에서 GitHub 흔적 0.
          # 레거시 운영과 동일한 secret 명 재사용 (EMAIL_SENDER/EMAIL_PASSWORD/EMAIL_RECEIVER).
          # workflow_dispatch 의 recipient_email 입력은 EMAIL_RECEIVER 를 덮어쓴다 (1회성 샘플 발송용).
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          BRIEFING_RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email != '' && github.event.inputs.recipient_email || secrets.EMAIL_RECEIVER }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || '0' }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || '이민·비자 정책 브리핑' }}
          # 이메일 활성화 시 Issue 는 기본 OFF. 둘 다 보내려면 BRIEFING_PUBLISH_ISSUE=1 (var)
          BRIEFING_PUBLISH_ISSUE: ${{ vars.BRIEFING_PUBLISH_ISSUE || '' }}
          # GITHUB_REPOSITORY is auto-set by the runner; GITHUB_TOKEN must be passed explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.diagnose }}" = "true" ]; then
            python -m briefing.diagnose
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m briefing.main --dry-run
          else
            python -m briefing.main
          fi

      - name: Upload state as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-state-${{ github.run_id }}
          path: |
            data/state.sqlite3
            data/diagnose/
          retention-days: 30
          if-no-files-found: ignore
